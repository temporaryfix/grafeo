[package]
name = "grafeo-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "WebAssembly bindings for Grafeo graph database"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
grafeo-engine = { workspace = true }
grafeo-core = { workspace = true, default-features = false, optional = true }
grafeo-common.workspace = true
grafeo-bindings-common = { workspace = true }

# WASM bindings
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

# Better panic messages in browser console
console_error_panic_hook = "0.1"

# Serialization (for snapshot export/import)
serde.workspace = true
serde_json = "1.0"

# Snapshot integrity (HMAC-SHA256 over exported bytes)
hmac = "0.13"
sha2 = { workspace = true }

# OPFS persistence backend (optional; enabled only by the `opfs` feature).
# web-sys must NEVER reach the default build (826 KiB gzip budget), so both are
# optional and pulled in exclusively by `opfs`.
wasm-bindgen-futures = { version = "0.4", optional = true }

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
    "Navigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemWritableFileStream",
    "FileSystemGetFileOptions",
    "FileSystemGetDirectoryOptions",
    "File",
    "Blob",
    "Window",
    "DomException",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["edge"]
cdc = ["grafeo-engine/cdc", "grafeo-bindings-common/cdc"]
gql = ["grafeo-engine/gql"]
cypher = ["grafeo-engine/cypher"]
rabitq-codec = ["dep:grafeo-core"]
fsst-codec = ["dep:grafeo-core"]
webgraph-codec = ["dep:grafeo-core"]
rdf-model = ["grafeo-engine/triple-store", "dep:grafeo-core", "grafeo-core/triple-store"]
sparql = ["grafeo-engine/sparql", "rdf-model"]
gremlin = ["grafeo-engine/gremlin"]
graphql = ["grafeo-engine/graphql"]
sql-pgq = ["grafeo-engine/sql-pgq"]
vector-index = ["grafeo-engine/vector-index"]
text-index = ["grafeo-engine/text-index"]
hybrid-search = ["grafeo-engine/hybrid-search"]
algos = ["grafeo-engine/algos"]
languages = ["gql", "cypher", "sparql", "gremlin", "graphql", "sql-pgq"]
compact-store = ["grafeo-engine/lpg", "grafeo-engine/compact-store"]
# Browser OPFS (Origin-Private File System) persistence for the content-addressed
# block pool. OFF by default and pulled by NO default feature: it drags in web-sys,
# which must never reach the default wasm build (826 KiB gzip budget). Enables the
# in-memory BlockPool via grafeo-core/compact-store so it is reachable from wasm.
opfs = [
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
    "dep:grafeo-core",
    "grafeo-core/compact-store",
]
# Persona-based profiles
lpg = ["grafeo-engine/lpg", "gql", "cypher", "gremlin", "sql-pgq", "grafeo-engine/regex"]  # Graph App Developer
rdf = ["rdf-model", "sparql", "grafeo-engine/regex-lite"]  # SPARQL without GQL/GraphQL / LPG
native = ["grafeo-engine/lpg", "rdf-model", "grafeo-engine/regex-lite"]  # Parser-free LPG + RDF
ai = ["vector-index", "text-index", "hybrid-search"]  # AI/Agent Developer
analytics = ["ai", "algos"]  # Data Scientist (ai search + graph algorithms)
edge = ["grafeo-engine/lpg", "gql", "compact-store", "grafeo-engine/regex-lite"]  # Frontend/Edge
# Broad capability profile
full = ["lpg", "languages", "ai", "algos", "rdf-model", "cdc"]

[lints]
workspace = true
