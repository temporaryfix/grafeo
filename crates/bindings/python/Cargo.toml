[package]
name = "grafeo-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for Grafeo graph database"

[lib]
name = "grafeo"
crate-type = ["cdylib"]
doc = false

[dependencies]
grafeo-engine = { workspace = true }
grafeo-core = { workspace = true }
grafeo-common = { workspace = true }
grafeo-adapters = { workspace = true }
grafeo-bindings-common = { workspace = true }

pyo3 = { workspace = true, features = ["extension-module", "abi3-py312"] }
pyo3-async-runtimes = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
serde_json = "1.0"

[features]
default = ["embedded"]
gql = ["grafeo-engine/gql"]
async-query = ["gql", "grafeo-engine/lpg", "grafeo-engine/spill", "grafeo-engine/async-storage"]
cypher = ["grafeo-engine/cypher"]
sparql = ["grafeo-engine/sparql", "grafeo-engine/triple-store"]
gremlin = ["grafeo-engine/gremlin"]
graphql = ["grafeo-engine/graphql"]
sql-pgq = ["grafeo-engine/sql-pgq"]
vector-index = ["grafeo-engine/vector-index"]
text-index = ["grafeo-engine/text-index"]
hybrid-search = ["grafeo-engine/hybrid-search"]
cdc = ["grafeo-engine/cdc"]
embed = ["grafeo-engine/embed"]
algos = ["grafeo-engine/algos"]
triple-store = ["grafeo-engine/triple-store"]
shacl = ["grafeo-engine/shacl"]
ring-index = ["grafeo-engine/ring-index", "triple-store"]
# Compact maintenance requires the LPG store, including without a query parser.
compact-store = ["grafeo-engine/compact-store", "grafeo-engine/lpg"]
arrow-export = ["grafeo-engine/arrow-export"]
jsonl-import = ["grafeo-engine/jsonl-import"]
parquet-import = ["grafeo-engine/parquet-import"]
metrics = ["grafeo-engine/metrics"]
languages = ["gql", "cypher", "sparql", "gremlin", "graphql", "sql-pgq"]
ai = ["vector-index", "text-index", "hybrid-search", "cdc"]
storage = ["grafeo-engine/storage"]
# Persona-based profiles
lpg = ["grafeo-engine/lpg", "gql", "async-query", "cypher", "gremlin", "sql-pgq", "storage", "grafeo-engine/regex"]
rdf = ["triple-store", "sparql", "graphql", "ring-index", "storage", "grafeo-engine/regex", "shacl"]
native = ["grafeo-engine/native", "triple-store"]
analytics = ["algos", "vector-index", "text-index", "hybrid-search", "jsonl-import", "parquet-import"]
edge = ["grafeo-engine/lpg", "gql", "compact-store", "grafeo-engine/regex-lite"]
# Deployment-based profiles (deprecated)
embedded = [
    "grafeo-engine/lpg",
    "gql",
    "async-query",
    "ai",
    "algos",
    "compact-store",
    "arrow-export",
    "grafeo-engine/parallel",
    "grafeo-engine/regex",
    "grafeo-engine/grafeo-file",
    "grafeo-engine/wal",
    "grafeo-engine/spill",
    "grafeo-engine/mmap",
]
full = ["embedded", "lpg", "languages", "rdf", "analytics", "ai"]

[lints]
workspace = true
