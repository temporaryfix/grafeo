# DIAGNOSTIC_ONLY: identical baseline CPU/service observations, not acceptance.
# One existing ordinary-cold control, five blocks and three phases: 15 records.
# Whole-command CPU includes fixture setup, warmup, measurement and analysis.
# No candidate production comparison, calibration PASS or PR cost verdict.
name: P8 identical-baseline focused CPU diagnostic

on:
  push:
    branches: [ci/p8-memory-comparison]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'temporaryfix/grafeo'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TERM_COLOR: never
      P8_ACTIONS_BLOCKS: '5'
      P8_PARENT_REF: 1c8d67e5d224a30d5b5fb7468718a68400a18dd3
      P8_CANDIDATE_REF: 1c8d67e5d224a30d5b5fb7468718a68400a18dd3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1c8d67e5d224a30d5b5fb7468718a68400a18dd3
          fetch-depth: 0
          persist-credentials: false
      - name: Free unused hosted SDK space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup "$HOME/.ghcup"
          df -h .
      - name: Prepare Rust and record runner
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          rustc +1.99.0 --version --verbose
          uname -a
          nproc
          free -h
          df -h .
      - name: Observe identical baseline ordinary-cold CPU service
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import hashlib
          import json
          import math
          import os
          import resource
          from pathlib import Path
          import shutil
          import subprocess
          import time

          print(
              'P8_DIAGNOSTIC_ONLY identical baseline ordinary-cold A/A/A; '
              'whole-command CPU observations, no calibration or PR cost acceptance',
              flush=True,
          )
          target = Path(os.environ['CARGO_TARGET_DIR']).resolve()
          target.mkdir(parents=True, exist_ok=True)
          refs = {
              'parent': os.environ['P8_PARENT_REF'],
              'candidate': os.environ['P8_CANDIDATE_REF'],
          }
          expected_inventories = {
              'parent': '671cc58518c0fe8a8426d823e6138158788066023f375d39a0f76b06980b65a5',
              'candidate': '671cc58518c0fe8a8426d823e6138158788066023f375d39a0f76b06980b65a5',
          }
          if refs['parent'] != refs['candidate']:
              raise RuntimeError('calibration requires identical pinned baseline refs')
          if expected_inventories['parent'] != expected_inventories['candidate']:
              raise RuntimeError('calibration requires identical audited inventory pins')
          families = ('native_aggregate_resource',)
          controls = ('groups_1024_rows_4096_ordinary_cold',)
          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def inventory_digest(files):
              return digest(json.dumps(files, sort_keys=True, separators=(',', ':')).encode())

          def validate_flat_sample(sample):
              if not isinstance(sample, dict) or sample.get('sampling_mode') != 'Flat':
                  raise RuntimeError('calibration requires actual Flat sampling')
              iterations = sample.get('iters')
              times = sample.get('times')
              if not isinstance(iterations, list) or not isinstance(times, list):
                  raise RuntimeError('calibration sample arrays are missing')
              if len(iterations) != 50 or len(times) != 50:
                  raise RuntimeError('calibration requires exactly 50 measured samples')
              if any(
                  isinstance(value, bool) or not isinstance(value, (int, float))
                  or not math.isfinite(value) or value <= 0
                  or value != iterations[0] or value != int(value)
                  for value in iterations
              ):
                  raise RuntimeError('Flat sample iteration counts must be positive equal integers')
              if any(
                  isinstance(value, bool) or not isinstance(value, (int, float))
                  or not math.isfinite(value) or value <= 0
                  for value in times
              ):
                  raise RuntimeError('calibration sample times must be finite and positive')

          # These child-usage fields accumulate across waited-for children.
          # Peak RSS and other nonadditive fields are deliberately not differenced.
          CHILD_ADDITIVE_FIELDS = (
              ('user_cpu_seconds', 'ru_utime'),
              ('system_cpu_seconds', 'ru_stime'),
              ('voluntary_context_switches', 'ru_nvcsw'),
              ('involuntary_context_switches', 'ru_nivcsw'),
              ('minor_page_faults', 'ru_minflt'),
              ('major_page_faults', 'ru_majflt'),
              ('block_input_operations', 'ru_inblock'),
              ('block_output_operations', 'ru_oublock'),
          )

          def child_usage_delta(before, after, elapsed):
              usage = {
                  name: getattr(after, attribute) - getattr(before, attribute)
                  for name, attribute in CHILD_ADDITIVE_FIELDS
              }
              usage['cpu_seconds'] = usage['user_cpu_seconds'] + usage['system_cpu_seconds']
              usage['elapsed_wall_seconds'] = elapsed
              usage['cpu_over_wall'] = usage['cpu_seconds'] / elapsed if elapsed > 0 else None
              return usage

          def optional_read(path, line_prefix=None):
              # Observability gaps are data, not reasons to fail this diagnostic.
              try:
                  value = path.read_text()
                  if line_prefix is not None:
                      value = next(
                          line for line in value.splitlines() if line.startswith(line_prefix)
                      )
                  return {'path': str(path), 'value': value.strip()}
              except (OSError, UnicodeError, StopIteration) as error:
                  return {'path': str(path), 'error': f'{type(error).__name__}: {error}'}

          def host_metrics(cpu):
              cgroup_self = optional_read(Path('/proc/self/cgroup'))
              cgroup_directory = Path('/sys/fs/cgroup')
              for line in cgroup_self.get('value', '').splitlines():
                  if line.startswith('0::'):
                      relative = Path(line.split(':', 2)[2].lstrip('/'))
                      if '..' not in relative.parts:
                          cgroup_directory = cgroup_directory / relative
                      break
              frequency_directory = Path(f'/sys/devices/system/cpu/cpu{cpu}/cpufreq')
              return {
                  'captured_monotonic_seconds': time.monotonic(),
                  'proc_stat_cpu': optional_read(Path('/proc/stat'), f'cpu{cpu} '),
                  'loadavg': optional_read(Path('/proc/loadavg')),
                  'cgroup_self': cgroup_self,
                  'cgroup_cpu_stat': optional_read(cgroup_directory / 'cpu.stat'),
                  'cgroup_cpu_max': optional_read(cgroup_directory / 'cpu.max'),
                  'cpufreq': {
                      name: optional_read(frequency_directory / name)
                      for name in (
                          'scaling_cur_freq', 'cpuinfo_cur_freq',
                          'scaling_min_freq', 'scaling_max_freq',
                          'cpuinfo_min_freq', 'cpuinfo_max_freq', 'scaling_governor',
                      )
                  },
              }

          def source_seal():
              dirty = subprocess.check_output([
                  'git', 'status', '--porcelain', '--untracked-files=no',
              ])
              if dirty.strip():
                  raise RuntimeError('tracked source is dirty')
              paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
              files = {}
              for raw in sorted(path for path in paths if path):
                  path = Path(os.fsdecode(raw))
                  data = os.fsencode(os.readlink(path)) if path.is_symlink() else path.read_bytes()
                  files[str(path)] = digest(data)
              return files

          binaries, binary_hashes, builds, seals = {}, {}, {}, {}

          def verify_binary(label):
              if digest(binaries[label].read_bytes()) != binary_hashes[label]:
                  raise RuntimeError(f'{label} retained binary changed')

          for label, ref in refs.items():
              subprocess.run(['git', 'checkout', '--detach', ref], check=True)
              if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != ref:
                  raise RuntimeError('checkout does not match the pinned commit')
              before = source_seal()
              inventory_hash = inventory_digest(before)
              if inventory_hash != expected_inventories[label]:
                  raise RuntimeError(f'{label} source differs from the audited byte inventory')
              before_path = target / f'p8-{label}-source-before.json'
              before_path.write_text(json.dumps(before, sort_keys=True, indent=2) + '\n')
              messages = target / f'p8-{label}-build.jsonl'
              log = target / f'p8-{label}-build.log'
              command = [
                  'cargo', '+1.99.0', 'test', '--release', '--locked',
                  '-p', 'grafeo-engine', '--all-features', '--bench',
                  'regression_bench', '--no-run', '--message-format=json',
              ]
              with messages.open('w') as stdout, log.open('w') as stderr:
                  result = subprocess.run(command, stdout=stdout, stderr=stderr)
              print(f'P8_BUILD_LOG_BEGIN {label}', flush=True)
              print(log.read_text(errors='replace'), flush=True)
              print(messages.read_text(errors='replace'), flush=True)
              print(f'P8_BUILD_LOG_END {label}', flush=True)
              if result.returncode:
                  raise RuntimeError(f'{label} build failed: {result.returncode}')
              executable, configuration = None, {}
              for line in messages.read_text().splitlines():
                  event = json.loads(line)
                  if event.get('reason') != 'compiler-artifact':
                      continue
                  name = event['target']['name']
                  if name not in ('grafeo_common', 'grafeo_core', 'grafeo_engine', 'regression_bench'):
                      continue
                  profile = event['profile']
                  key = f"{name}:{profile['test']}"
                  actual = {'features': sorted(event['features']), 'profile': profile}
                  if key in configuration and configuration[key] != actual:
                      raise RuntimeError(f'inconsistent compiled configuration: {key}')
                  configuration[key] = actual
                  if name == 'regression_bench' and event.get('executable'):
                      executable = Path(event['executable'])
              for name in ('grafeo_common', 'grafeo_core', 'grafeo_engine', 'regression_bench'):
                  if not any(key.startswith(name + ':') for key in configuration):
                      raise RuntimeError(f'missing actual build configuration: {name}')
              if executable is None:
                  raise RuntimeError('benchmark executable missing from compiler artifacts')
              binary = target / f'p8-{label}-cost-bench'
              shutil.copy2(executable, binary)
              after = source_seal()
              (target / f'p8-{label}-source-after.json').write_text(
                  json.dumps(after, sort_keys=True, indent=2) + '\n'
              )
              if before != after:
                  raise RuntimeError(f'{label} build changed source bytes')
              binaries[label], builds[label], seals[label] = binary, configuration, before
              binary_hashes[label] = digest(binary.read_bytes())
              print('P8_BUILD_JSON ' + json.dumps({
                  'label': label, 'ref': ref, 'source_files': len(before),
                  'source_sha256': inventory_hash,
                  'binary_sha256': binary_hashes[label],
                  'binary_bytes': binary.stat().st_size, 'configuration': configuration,
              }), flush=True)

          if builds['parent'] != builds['candidate']:
              raise RuntimeError('actual parent/candidate features or profiles differ')
          print('P8_FEATURE_PROFILE_PARITY verified', flush=True)
          if seals['parent'] != seals['candidate']:
              raise RuntimeError('calibration baseline source inventories differ')
          if binary_hashes['parent'] != binary_hashes['candidate']:
              raise RuntimeError('calibration requires byte-identical baseline binaries')
          print('P8_DIAGNOSTIC_IDENTITY refs/source/features/profiles/binary verified', flush=True)

          if os.sched_getscheduler(0) != os.SCHED_OTHER or os.getpriority(os.PRIO_PROCESS, 0) != 0:
              raise RuntimeError('benchmark launcher must run with SCHED_OTHER and nice 0')
          available_cpus = sorted(os.sched_getaffinity(0))
          cpu = available_cpus[0]
          print('P8_SCHEDULING_JSON ' + json.dumps({
              'cpu': cpu, 'available_cpus': available_cpus,
              'uid': os.getuid(), 'euid': os.geteuid(),
              'policy': 'SCHED_OTHER', 'nice': 0,
          }), flush=True)

          def pin_benchmark_child():
              os.sched_setaffinity(0, {cpu})

          for label, binary in binaries.items():
              for family in families:
                  verify_binary(label)
                  if source_seal() != seals['candidate']:
                      raise RuntimeError('source changed before preflight')
                  log = target / f'p8-{label}-{family}-preflight.log'
                  with log.open('w') as output:
                      result = subprocess.run([str(binary), f'{family}/{controls[0]}', '--exact', '--test'],
                                              stdout=output, stderr=subprocess.STDOUT,
                                              preexec_fn=pin_benchmark_child)
                  verify_binary(label)
                  if source_seal() != seals['candidate']:
                      raise RuntimeError('preflight changed source bytes')
                  print(log.read_text(), flush=True)
                  if result.returncode:
                      raise RuntimeError(f'{label} {family} preflight failed')

          blocks = int(os.environ['P8_ACTIONS_BLOCKS'])
          if blocks != 5:
              raise RuntimeError('diagnostic requires exactly five complete blocks')
          cases = [(family, control) for family in families for control in controls]
          records = 0
          for block in range(blocks):
              ordered_cases = cases if block % 2 == 0 else list(reversed(cases))
              for family, control in ordered_cases:
                  for phase, label, baseline_option in (
                      ('parent-baseline', 'parent', '--save-baseline'),
                      ('candidate', 'candidate', '--baseline'),
                      ('parent-aa', 'parent', '--baseline'),
                  ):
                      verify_binary(label)
                      if source_seal() != seals['candidate']:
                          raise RuntimeError(f'source changed before {phase} {family}/{control}')
                      phase_dir = target / 'p8-results' / f'block-{block}' / phase
                      phase_dir.mkdir(parents=True, exist_ok=True)
                      case = target / 'criterion' / family / control
                      for folder in ('new', 'change'):
                          shutil.rmtree(case / folder, ignore_errors=True)
                      command = [
                          str(binaries[label]), f'{family}/{control}', '--exact', '--bench', '--noplot',
                          '--sample-size', '50', '--warm-up-time', '3',
                          '--measurement-time', '10', baseline_option, f'p8-parent-block-{block}',
                      ]
                      log = target / f'p8-block-{block}-{phase}-{family}-{control}.log'
                      print(f'P8_TIMING_START block={block} {phase} {family}/{control} epoch={time.time():.6f}', flush=True)
                      host_before = host_metrics(cpu)
                      with log.open('w') as output:
                          # No source, git, hashing or host-reading subprocess
                          # may enter this child-usage bracket.
                          child_before = resource.getrusage(resource.RUSAGE_CHILDREN)
                          started = time.monotonic()
                          result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT,
                                                  preexec_fn=pin_benchmark_child)
                          elapsed = time.monotonic() - started
                          child_after = resource.getrusage(resource.RUSAGE_CHILDREN)
                      host_after = host_metrics(cpu)
                      usage = child_usage_delta(child_before, child_after, elapsed)
                      print(f'P8_TIMING_END block={block} {phase} {family}/{control} elapsed_seconds={elapsed:.6f}', flush=True)
                      verify_binary(label)
                      if source_seal() != seals['candidate']:
                          raise RuntimeError(f'{phase} {family}/{control} changed source bytes')
                      print(log.read_text(), flush=True)
                      if result.returncode:
                          raise RuntimeError(f'{phase} {family}/{control} measurement failed')
                      record = {
                          'block': block, 'phase': phase, 'control': f'{family}/{control}',
                          'ref': refs[label],
                          'binary_sha256': binary_hashes[label],
                          'diagnostic': {
                              'diagnostic_only': True,
                              'scope': (
                                  'whole benchmark subprocess, including fixture setup, warmup, '
                                  'measurement and analysis; not per-query CPU'
                              ),
                              'child_usage': usage,
                              'host_before': host_before,
                              'host_after': host_after,
                          },
                      }
                      record['raw_files'] = {}
                      for name in ('benchmark.json', 'estimates.json', 'sample.json', 'tukey.json'):
                          raw = (case / 'new' / name).read_text()
                          record[name] = json.loads(raw)
                          record['raw_files'][name] = raw
                          if name == 'sample.json':
                              validate_flat_sample(record[name])
                      change_path = case / 'change' / 'estimates.json'
                      if baseline_option == '--baseline' and not change_path.is_file():
                          raise RuntimeError(f'missing baseline comparison: {phase} {control}')
                      if change_path.is_file():
                          raw = change_path.read_text()
                          record['change/estimates.json'] = json.loads(raw)
                          record['raw_files']['change/estimates.json'] = raw
                      if phase == 'parent-aa':
                          interval = record['change/estimates.json']['mean']['confidence_interval']
                          quiet = interval['lower_bound'] >= -0.02 and interval['upper_bound'] <= 0.02
                          record['aa_noise_2pct'] = 'WITHIN_BOUND' if quiet else 'INCONCLUSIVE'
                      snapshot = phase_dir / f'{family}--{control}.json'
                      snapshot.write_text(json.dumps(record, sort_keys=True) + '\n')
                      print('P8_RESULT_JSON ' + json.dumps(record, sort_keys=True), flush=True)
                      records += 1
          if records != 15:
              raise RuntimeError(f'diagnostic requires exactly 15 complete records, found {records}')
          print('P8_DIAGNOSTIC_COMPLETE DIAGNOSTIC_ONLY no calibration or PR cost acceptance', flush=True)
          PY
