# LOCAL HOLD: do not publish until all eight fresh stratified calibration cases and model review qualify.
# Comparison data only; job success and numeric gates do not accept PR costs.
name: P8 stratified candidate comparison (HOLD)

on:
  push:
    branches: [ci/p8-memory-comparison]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'temporaryfix/grafeo'
    name: Comparison ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - case: native_aggregate_resource/groups_1024_rows_4096_cached
            blocks: 256
          - case: native_aggregate_resource/groups_1024_rows_4096_configured_resident
            blocks: 256
          - case: native_aggregate_resource/groups_1024_rows_4096_ordinary_cold
            blocks: 256
          - case: native_aggregate_resource/groups_1024_rows_4096_pressure_90_percent
            blocks: 256
          - case: native_owned_aggregate_resource/groups_1024_rows_4096_cached
            blocks: 256
          - case: native_owned_aggregate_resource/groups_1024_rows_4096_configured_resident
            blocks: 256
          - case: native_owned_aggregate_resource/groups_1024_rows_4096_ordinary_cold
            blocks: 256
          - case: native_owned_aggregate_resource/groups_1024_rows_4096_pressure_90_percent
            blocks: 256
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TERM_COLOR: never
      P8_ACTIONS_PROTOCOL: stratified-v1
      P8_ACTIONS_SCOPE: fresh-candidate-comparison
      P8_ACTIONS_CASE: ${{ matrix.case }}
      P8_ACTIONS_BLOCKS: ${{ matrix.blocks }}
      P8_PARENT_REF: b0115ff1f5ff5df25442309a257540ac54975591
      P8_CANDIDATE_REF: 94eb5c45b683b2a2f8934cc4ebbd61112ecff57b
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b0115ff1f5ff5df25442309a257540ac54975591
          fetch-depth: 0
          persist-credentials: false
      - name: Free unused hosted SDK space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup "$HOME/.ghcup"
          df -h .
      - name: Prepare Rust and record runner
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          rustc +1.99.0 --version --verbose
          uname -a
          nproc
          free -h
          df -h .
      - name: Measure the exact comparison case with balanced follow-up order
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import hashlib
          import json
          import math
          import os
          import re
          from pathlib import Path
          import shutil
          import subprocess
          import time

          print(
              'P8_COMPARISON_DATA_ONLY stratified-v1 fresh-candidate-comparison; '
              'acceptance pending all-eight calibration, source/I/O evidence and model review',
              flush=True,
          )
          target = Path(os.environ['CARGO_TARGET_DIR']).resolve()
          target.mkdir(parents=True, exist_ok=True)
          refs = {
              'parent': os.environ['P8_PARENT_REF'],
              'candidate': os.environ['P8_CANDIDATE_REF'],
          }
          expected_inventories = {
              'parent': '5401cceea568f95aeb77a99656a3bb303b731d4a92962d4469241e513a1403d2',
              'candidate': '5f64657512c30ad51d07a5e6145a2c13f0e9a17920e07d165b055dbf4a4ac677',
          }
          expected_source_files = {'parent': 1755, 'candidate': 1756}
          for label in ('parent', 'candidate'):
              if not re.fullmatch(r'[0-9a-f]{40}', refs[label]):
                  raise RuntimeError(f'replace the audited {label} ref placeholder before launch')
              if not re.fullmatch(r'[0-9a-f]{64}', expected_inventories[label]):
                  raise RuntimeError(f'replace the audited {label} inventory placeholder before launch')
          if refs['parent'] == refs['candidate']:
              raise RuntimeError('comparison requires distinct parent/candidate refs')
          if expected_inventories['parent'] == expected_inventories['candidate']:
              raise RuntimeError('comparison requires distinct parent/candidate source inventories')
          BLOCKS_BY_CASE = {'native_aggregate_resource/groups_1024_rows_4096_cached': 256, 'native_aggregate_resource/groups_1024_rows_4096_configured_resident': 256, 'native_aggregate_resource/groups_1024_rows_4096_ordinary_cold': 256, 'native_aggregate_resource/groups_1024_rows_4096_pressure_90_percent': 256, 'native_owned_aggregate_resource/groups_1024_rows_4096_cached': 256, 'native_owned_aggregate_resource/groups_1024_rows_4096_configured_resident': 256, 'native_owned_aggregate_resource/groups_1024_rows_4096_ordinary_cold': 256, 'native_owned_aggregate_resource/groups_1024_rows_4096_pressure_90_percent': 256}
          SEED = 'p8-stratified-wall-mean-v1-20261021'
          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def inventory_digest(files):
              return digest(json.dumps(files, sort_keys=True, separators=(',', ':')).encode())

          def stratified_phase_order(protocol, scope, case_name, block_text):
              if protocol != 'stratified-v1' or scope != 'fresh-candidate-comparison':
                  raise RuntimeError('this workflow supports fresh-candidate-comparison stratified-v1 only')
              if case_name not in BLOCKS_BY_CASE:
                  raise RuntimeError('unknown exact stratified case')
              if block_text != str(BLOCKS_BY_CASE[case_name]):
                  raise RuntimeError('matrix block count differs from the frozen planning map')
              blocks = int(block_text)
              if blocks != 256:
                  raise RuntimeError('stratified comparison requires 32 strata of eight triplets')
              order = []
              for stratum in range(blocks // 8):
                  ranked = sorted(
                      range(8),
                      key=lambda slot: (
                          hashlib.sha256(
                              f'{SEED}|{scope}|{case_name}|{stratum}|{slot}'.encode('utf-8')
                          ).digest(),
                          slot,
                      ),
                  )
                  candidate_first = set(ranked[:4])
                  for slot in range(8):
                      block = 8 * stratum + slot
                      followups = ('candidate', 'parent-aa') if slot in candidate_first else ('parent-aa', 'candidate')
                      order.extend([block, phase, case_name] for phase in ('parent-baseline',) + followups)
              if len(order) != 3 * blocks:
                  raise RuntimeError('incomplete stratified phase order')
              return order

          protocol = os.environ['P8_ACTIONS_PROTOCOL']
          scope = os.environ['P8_ACTIONS_SCOPE']
          case_name = os.environ['P8_ACTIONS_CASE']
          phase_order = stratified_phase_order(protocol, scope, case_name, os.environ['P8_ACTIONS_BLOCKS'])
          blocks = BLOCKS_BY_CASE[case_name]
          family, control = case_name.split('/', 1)
          phase_order_sha256 = digest(json.dumps(phase_order, separators=(',', ':')).encode('utf-8'))

          def validate_flat_sample(sample):
              if not isinstance(sample, dict) or sample.get('sampling_mode') != 'Flat':
                  raise RuntimeError('comparison requires actual Flat sampling')
              iterations = sample.get('iters')
              times = sample.get('times')
              if not isinstance(iterations, list) or not isinstance(times, list):
                  raise RuntimeError('comparison sample arrays are missing')
              if len(iterations) != 50 or len(times) != 50:
                  raise RuntimeError('comparison requires exactly 50 measured samples')
              if any(
                  isinstance(value, bool) or not isinstance(value, (int, float))
                  or not math.isfinite(value) or value <= 0
                  or value != iterations[0] or value != int(value)
                  for value in iterations
              ):
                  raise RuntimeError('Flat sample iteration counts must be positive equal integers')
              if any(
                  isinstance(value, bool) or not isinstance(value, (int, float))
                  or not math.isfinite(value) or value <= 0
                  for value in times
              ):
                  raise RuntimeError('comparison sample times must be finite and positive')

          def source_seal():
              dirty = subprocess.check_output([
                  'git', 'status', '--porcelain', '--untracked-files=no',
              ])
              if dirty.strip():
                  raise RuntimeError('tracked source is dirty')
              paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
              files = {}
              for raw in sorted(path for path in paths if path):
                  path = Path(os.fsdecode(raw))
                  data = os.fsencode(os.readlink(path)) if path.is_symlink() else path.read_bytes()
                  files[str(path)] = digest(data)
              return files

          binaries, binary_hashes, builds, seals = {}, {}, {}, {}

          def verify_binary(label):
              if digest(binaries[label].read_bytes()) != binary_hashes[label]:
                  raise RuntimeError(f'{label} retained binary changed')

          for label, ref in refs.items():
              subprocess.run(['git', 'checkout', '--detach', ref], check=True)
              if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != ref:
                  raise RuntimeError('checkout does not match the pinned commit')
              before = source_seal()
              inventory_hash = inventory_digest(before)
              if len(before) != expected_source_files[label]:
                  raise RuntimeError(f'{label} source count differs from the audited inventory')
              if inventory_hash != expected_inventories[label]:
                  raise RuntimeError(f'{label} source differs from the audited byte inventory')
              before_path = target / f'p8-{label}-source-before.json'
              before_path.write_text(json.dumps(before, sort_keys=True, indent=2) + '\n')
              messages = target / f'p8-{label}-build.jsonl'
              log = target / f'p8-{label}-build.log'
              command = [
                  'cargo', '+1.99.0', 'test', '--release', '--locked',
                  '-p', 'grafeo-engine', '--all-features', '--bench',
                  'regression_bench', '--no-run', '--message-format=json',
              ]
              with messages.open('w') as stdout, log.open('w') as stderr:
                  result = subprocess.run(command, stdout=stdout, stderr=stderr)
              print(f'P8_BUILD_LOG_BEGIN {label}', flush=True)
              print(log.read_text(errors='replace'), flush=True)
              print(messages.read_text(errors='replace'), flush=True)
              print(f'P8_BUILD_LOG_END {label}', flush=True)
              if result.returncode:
                  raise RuntimeError(f'{label} build failed: {result.returncode}')
              executable, configuration = None, {}
              for line in messages.read_text().splitlines():
                  event = json.loads(line)
                  if event.get('reason') != 'compiler-artifact':
                      continue
                  name = event['target']['name']
                  if name not in ('grafeo_common', 'grafeo_core', 'grafeo_engine', 'regression_bench'):
                      continue
                  profile = event['profile']
                  key = f"{name}:{profile['test']}"
                  actual = {'features': sorted(event['features']), 'profile': profile}
                  if key in configuration and configuration[key] != actual:
                      raise RuntimeError(f'inconsistent compiled configuration: {key}')
                  configuration[key] = actual
                  if name == 'regression_bench' and event.get('executable'):
                      executable = Path(event['executable'])
              for name in ('grafeo_common', 'grafeo_core', 'grafeo_engine', 'regression_bench'):
                  if not any(key.startswith(name + ':') for key in configuration):
                      raise RuntimeError(f'missing actual build configuration: {name}')
              if executable is None:
                  raise RuntimeError('benchmark executable missing from compiler artifacts')
              binary = target / f'p8-{label}-cost-bench'
              shutil.copy2(executable, binary)
              after = source_seal()
              (target / f'p8-{label}-source-after.json').write_text(
                  json.dumps(after, sort_keys=True, indent=2) + '\n'
              )
              if before != after:
                  raise RuntimeError(f'{label} build changed source bytes')
              binaries[label], builds[label], seals[label] = binary, configuration, before
              binary_hashes[label] = digest(binary.read_bytes())
              print('P8_BUILD_JSON ' + json.dumps({
                  'label': label, 'ref': ref, 'source_files': len(before),
                  'source_sha256': inventory_hash,
                  'binary_sha256': binary_hashes[label],
                  'binary_bytes': binary.stat().st_size, 'configuration': configuration,
              }), flush=True)

          if builds['parent'] != builds['candidate']:
              raise RuntimeError('actual parent/candidate features or profiles differ')
          print('P8_FEATURE_PROFILE_PARITY verified', flush=True)
          if binary_hashes['parent'] == binary_hashes['candidate']:
              raise RuntimeError('comparison requires distinct retained parent/candidate binaries')
          print('P8_COMPARISON_IDENTITIES separately pinned refs/source/binaries and matching features/profiles verified', flush=True)

          if os.sched_getscheduler(0) != os.SCHED_OTHER or os.getpriority(os.PRIO_PROCESS, 0) != 0:
              raise RuntimeError('benchmark launcher must run with SCHED_OTHER and nice 0')
          available_cpus = sorted(os.sched_getaffinity(0))
          cpu = available_cpus[0]
          print('P8_SCHEDULING_JSON ' + json.dumps({
              'cpu': cpu, 'available_cpus': available_cpus,
              'uid': os.getuid(), 'euid': os.geteuid(),
              'policy': 'SCHED_OTHER', 'nice': 0,
              'protocol': protocol, 'scope': scope, 'case': case_name,
              'blocks': blocks, 'seed': SEED, 'phase_order_sha256': phase_order_sha256,
          }), flush=True)

          def pin_benchmark_child():
              os.sched_setaffinity(0, {cpu})

          for label, binary in binaries.items():
              verify_binary(label)
              if source_seal() != seals['candidate']:
                  raise RuntimeError('source changed before preflight')
              log = target / f'p8-{label}-{family}-{control}-preflight.log'
              with log.open('w') as output:
                  result = subprocess.run([str(binary), case_name, '--exact', '--test'],
                                          stdout=output, stderr=subprocess.STDOUT,
                                          preexec_fn=pin_benchmark_child)
              verify_binary(label)
              if source_seal() != seals['candidate']:
                  raise RuntimeError('preflight changed source bytes')
              print(log.read_text(), flush=True)
              if result.returncode:
                  raise RuntimeError(f'{label} {case_name} preflight failed')

          completed_order = []
          for block, phase, planned_case in phase_order:
              if planned_case != case_name:
                  raise RuntimeError('phase order contains a different case')
              label = 'candidate' if phase == 'candidate' else 'parent'
              baseline_option = '--save-baseline' if phase == 'parent-baseline' else '--baseline'
              verify_binary(label)
              if source_seal() != seals['candidate']:
                  raise RuntimeError(f'source changed before {phase} {case_name}')
              phase_dir = target / 'p8-results' / f'block-{block}' / phase
              phase_dir.mkdir(parents=True, exist_ok=True)
              criterion_case = target / 'criterion' / family / control
              for folder in ('new', 'change'):
                  shutil.rmtree(criterion_case / folder, ignore_errors=True)
              command = [
                  str(binaries[label]), case_name, '--exact', '--bench', '--noplot',
                  '--sample-size', '50', '--warm-up-time', '1',
                  '--measurement-time', '1', baseline_option, f'p8-parent-block-{block}',
              ]
              log = target / f'p8-block-{block}-{phase}-{family}-{control}.log'
              print(f'P8_TIMING_START block={block} {phase} {case_name} epoch={time.time():.6f}', flush=True)
              started = time.monotonic()
              with log.open('w') as output:
                  result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT,
                                          preexec_fn=pin_benchmark_child)
              elapsed = time.monotonic() - started
              print(f'P8_TIMING_END block={block} {phase} {case_name} elapsed_seconds={elapsed:.6f}', flush=True)
              verify_binary(label)
              if source_seal() != seals['candidate']:
                  raise RuntimeError(f'{phase} {case_name} changed source bytes')
              print(log.read_text(), flush=True)
              if result.returncode:
                  raise RuntimeError(f'{phase} {case_name} measurement failed')
              record = {
                  'block': block, 'phase': phase, 'control': case_name,
                  'ref': refs[label], 'binary_sha256': binary_hashes[label],
              }
              record['raw_files'] = {}
              for name in ('benchmark.json', 'estimates.json', 'sample.json', 'tukey.json'):
                  raw = (criterion_case / 'new' / name).read_bytes().decode('utf-8')
                  record[name] = json.loads(raw)
                  record['raw_files'][name] = raw
                  if name == 'benchmark.json' and (
                      not isinstance(record[name], dict)
                      or record[name].get('full_id') != case_name
                  ):
                      raise RuntimeError('raw benchmark full_id differs from the exact planned case')
                  if name == 'sample.json':
                      validate_flat_sample(record[name])
              change_path = criterion_case / 'change' / 'estimates.json'
              if baseline_option == '--baseline' and not change_path.is_file():
                  raise RuntimeError(f'missing baseline comparison: {phase} {control}')
              if change_path.is_file():
                  raw = change_path.read_bytes().decode('utf-8')
                  record['change/estimates.json'] = json.loads(raw)
                  record['raw_files']['change/estimates.json'] = raw
              if phase == 'parent-aa':
                  # Diagnostic only; no per-record veto, exclusion, retry or acceptance.
                  interval = record['change/estimates.json']['mean']['confidence_interval']
                  quiet = interval['lower_bound'] >= -0.02 and interval['upper_bound'] <= 0.02
                  record['aa_noise_2pct'] = 'WITHIN_BOUND' if quiet else 'INCONCLUSIVE'
              snapshot = phase_dir / f'{family}--{control}.json'
              snapshot.write_text(json.dumps(record, sort_keys=True) + '\n')
              print('P8_RESULT_JSON ' + json.dumps(record, sort_keys=True), flush=True)
              completed_order.append([block, phase, case_name])
          if completed_order != phase_order or len(completed_order) != 3 * blocks:
              raise RuntimeError('stratified requires every planned phase without exclusions')
          print(
              f'P8_COMPARISON_DATA_ONLY_COMPLETE protocol={protocol} scope={scope} '
              f'case={case_name} records={len(completed_order)}; no accepted rows; external review pending',
              flush=True,
          )
          print('P8_MEASUREMENTS_COMPLETE acceptance pending raw-data and A/A analysis', flush=True)
          PY
