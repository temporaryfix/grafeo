[workspace]
resolver = "2"
members = [
    "crates/grafeo",
    "crates/grafeo-common",
    "crates/grafeo-core",
    "crates/grafeo-adapters",
    "crates/grafeo-storage",
    "crates/grafeo-engine",
    "crates/grafeo-cli",
    "crates/bindings/python",
    "crates/bindings/node",
    "crates/bindings/c",
    "crates/bindings/wasm",
    "crates/bindings/common",
    "crates/grafeo-spec-tests",
    "examples/rust",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.91.1"
license = "Apache-2.0"
repository = "https://github.com/GrafeoDB/grafeo"
authors = ["S.T. Grond"]
description = "A high-performance, embeddable graph database with support for LPG RDF and all major graph query languages."

[workspace.dependencies]
# Internal crates (default-features = false to allow per-crate control)
grafeo-common = { path = "crates/grafeo-common", version = "0.0.1" }
grafeo-core = { path = "crates/grafeo-core", version = "0.0.1", default-features = false }
grafeo-adapters = { path = "crates/grafeo-adapters", version = "0.0.1", default-features = false }
grafeo-storage = { path = "crates/grafeo-storage", version = "0.0.1", default-features = false }
grafeo-engine = { path = "crates/grafeo-engine", version = "0.0.1", default-features = false }
grafeo = { path = "crates/grafeo", version = "0.0.1" }
grafeo-bindings-common = { path = "crates/bindings/common", version = "0.0.1", default-features = false }

# Error handling
thiserror = "2.0"
anyhow = "1.0.103"

# Concurrency & synchronization
parking_lot = { version = "0.12", features = ["arc_lock", "send_guard"] }
crossbeam = "0.8"
rayon = "1"
arc-swap = "1.7"

# Content hashing (physical Merkle-leaf for the temporal cold base)
blake3 = "1"
getrandom = "0.4"

# Data structures
hashbrown = { version = "=0.17.1", features = ["serde"] }
allocator-api2 = "=0.2.21"
smallvec = "1"
bumpalo = "3"
indexmap = "2"
dashmap = "6"
arcstr = { version = "1", features = ["serde"] }
bigdecimal = "0.4"

# Memory & I/O
memmap2 = "0.9.11"
bytes = "1"
byteorder = "1"
fs2 = "0.4"

# Checksums & hashing
crc32fast = "1"
foldhash = "0.2"
md5 = "0.8"
sha1 = "0.11"
sha2 = "0.11"

# Encryption (optional, behind `encryption` feature flag)
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.13"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = { version = "2.0", features = ["serde"] }

# Arrow (optional, for zero-copy data export)
arrow-schema = "59"
arrow-array = "59"
arrow-ipc = "59"

# Python bindings
pyo3 = "0.29"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros"] }

# Observability
tracing = "0.1"
tracing-subscriber = "0.3"

# Regex
regex = "1"
regex-lite = "0.1"

# Unicode
unicode-normalization = "0.1"

# Testing
proptest = "1"
criterion = { package = "codspeed-criterion-compat", version = "4" }
tempfile = "3"
rustix = { version = "1", features = ["fs", "process"] }
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Allocators (platform-optimized)
tikv-jemallocator = "0.6"
mimalloc = "0.1"

# Vector index support
libm = "=0.2.16"
ordered-float = "5"
rand = "0.10.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow common patterns in database code
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Cast lints: warn to catch real truncation bugs, allow per-site where safe
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "allow"
cast_possible_wrap = "warn"
cast_lossless = "allow"
# Style preferences
uninlined_format_args = "allow"
doc_markdown = "allow"
redundant_closure_for_method_calls = "allow"
similar_names = "allow"
too_many_lines = "allow"
type_complexity = "allow"
needless_pass_by_value = "allow"
items_after_statements = "allow"
unreadable_literal = "allow"
struct_field_names = "allow"
wildcard_imports = "warn"
if_not_else = "allow"
match_same_arms = "allow"
single_match_else = "allow"
return_self_not_must_use = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
needless_continue = "allow"
derivable_impls = "allow"
missing_fields_in_debug = "allow"
# Low-level memory code patterns
mut_from_ref = "allow"
ptr_as_ptr = "allow"
manual_slice_size_calculation = "allow"
# Additional pedantic allows
needless_range_loop = "allow"
default_trait_access = "allow"
unnested_or_patterns = "allow"
used_underscore_binding = "allow"
doc_link_with_quotes = "allow"
float_cmp = "allow"
should_implement_trait = "allow"
ref_option = "allow"
unnecessary_map_or = "allow"
while_let_loop = "allow"
manual_div_ceil = "allow"
needless_raw_string_hashes = "allow"
single_match = "allow"
match_wildcard_for_single_variants = "allow"
map_entry = "allow"
large_enum_variant = "allow"
implicit_hasher = "allow"
unnecessary_literal_bound = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
# Disk: debuginfo on workspace crates dominated target/debug (test binaries were
# ~49MB each). line-tables-only keeps backtraces readable without the full DWARF.
debug = "line-tables-only"
# Disk: incremental/ previously reached 27G. Disable it by default to bound disk
# use; set CARGO_INCREMENTAL=1 when faster edit/rebuild cycles justify the space.
incremental = false

[profile.bench]
lto = "thin"
codegen-units = 1

# Profiling: release performance with debug symbols for flamegraphs
[profile.profiling]
inherits = "release"
strip = false
debug = "full"
lto = false

# Minimal size for WASM or embedded
[profile.minimal-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Strip debug info from third-party dependencies in dev builds. Deps otherwise
# default to debug = 2 (full) and dominate target/debug. We rarely step into
# dep source; this cuts disk use with no effect on debugging our own crates.
[profile.dev.package."*"]
debug = false
